# ============================================================
# TimeAlign 模型配置
# ============================================================

# ---------------------- 模型结构 ----------------------

# 模型名称，用于选择对应的模型类和训练器
# 可选: timealign（后续扩展 itransformer, dlinear, patchtst）
model: timealign

# 输入序列长度（回看窗口）
# 值越大，模型能看到更长的历史趋势，但计算量增加
# 96 步 = 24 小时（15min 间隔），覆盖完整日周期
seq_len: 96

# 预测序列长度（预测窗口）
# 16 步 = 4 小时（15min 间隔），满足短期功率预测需求
pred_len: 16

# 输入特征维度
# 必须与预处理输出的特征数一致
# 当前: actual_power(1) + gfs(6) + tower(6) + time(4) = 17
enc_in: 17

# Patch 数量，将序列分 patch 处理
# seq_len / patch_num = 每个 patch 的步数（96/4=24步）
# 值越大 → 每个 patch 越短 → 更细粒度但信息更局部
# 值越小 → 每个 patch 越长 → 更全局但可能丢失局部模式
patch_num: 4

# 模型隐藏维度（patch 嵌入后的特征维度）
# 值越大 → 模型容量越大，能学到更复杂的模式，但更易过拟合
# 典型范围: 32~256
d_model: 128

# 前馈网络中间层维度
# 通常为 d_model 的 2~4 倍
# 控制编码器中 MLP 的非线性变换能力
d_ff: 256

# 编码器层数（x 分支和 y 分支各 e_layers 层）
# 值越大 → 模型越深，表达能力越强，但计算量线性增加
# 2 层对 70MW 风电场规模适中
e_layers: 2

# Dropout 率，训练时随机丢弃神经元的比例
# 值越大 → 正则化越强，越不容易过拟合，但可能欠拟合
# 0.1 为常用起点，数据少时可增大到 0.2~0.3
dropout: 0.2

# 是否在编码器层间使用 LayerNorm
# true: 训练更稳定，收敛更快（推荐）
# false: 减少计算开销，但可能训练不稳定
layer_norm: true

# 是否在 Patch 嵌入中添加位置编码
# true: 模型能感知 patch 的时序位置关系（推荐）
# false: 丢失位置信息，适合 patch 间无序的场景
pos: true

# local 对齐损失的 margin
# 0.0 = 严格对齐；增大后允许一定偏差，对齐约束更宽松
# 建议范围: 0.0~0.3
local_margin: 0.1

# global 对齐损失（Gram 矩阵）的 margin
# 0.0 = 严格分布对齐；增大后允许更大分布差异
# 建议范围: 0.0~0.3
global_margin: 0.1

# 是否启用 local 对齐（逐点余弦相似度）
# true: 激活局部特征对齐（推荐）
loc: true

# 是否启用 global 对齐（Gram 矩阵分布差异）
# true: 激活全局分布对齐（推荐）
glo: true

# ---------------------- 损失权重 ----------------------

# 重建损失权重（y 分支自编码重建的质量）
# 0 = 不使用重建损失；1.0 = 等权重参与
# 值越大 → y 分支的重建质量越重要
w_recon: 1.0

# 对齐损失权重（x/y 分支特征分布对齐程度）
# 0 = 不使用对齐损失；值越大 → 两分支对齐约束越强
# 0.1 为论文推荐值，对齐是辅助信号，不宜过大
w_align: 0.1

# ---------------------- 训练参数 ----------------------

# 随机种子，确保实验可复现
seed: 42

# 计算设备: cuda（GPU）/ cpu
# GPU 训练速度约为 CPU 的 10~50 倍
device: cuda

# 初始学习率
# 值越大 → 收敛越快但可能震荡；越小 → 更稳定但收敛慢
# AdamW 优化器下 0.001 为常用起点
lr: 0.0001

# 批大小
# 值越大 → 梯度估计越稳定，训练越快，但显存占用越高
# 32 在 24G 显存下安全；GPU 显存足够可增大到 64/128
batch_size: 32

# 最大训练轮数
# 实际由早停机制决定，通常不会跑满
epochs: 100

# 早停耐心值
# 验证损失连续 patience 个 epoch 不下降则停止训练
# 值越大 → 给模型更多恢复机会，但可能过拟合
patience: 10

# 优化器选择
# adamw: Adam + 权重衰减，泛化性好（推荐）
# adam: 标准自适应学习率
# sgd: 随机梯度下降，需要更精心的学习率调参
optimizer: adamw

# 学习率调度策略
# cosine: 余弦退火，周期性衰减（推荐，平滑降学习率）
# plateau: 验证损失停滞时降低学习率
# onecycle: 先升后降，适合快速收敛
# step: 每隔固定 epoch 数衰减
scheduler: cosine

# 梯度裁剪阈值
# 防止梯度爆炸，将梯度范数限制在此值以内
# 1.0 为常用值；0 表示不裁剪
grad_clip: 1.0

# ---------------------- 数据路径 ----------------------

# 预处理后的数据目录（preprocess.py 的输出）
data_dir: data/wind_power/processed

# 目标列名称（风电实际出力）
target_col: actual_power
