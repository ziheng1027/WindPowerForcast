# ============================================================
# DLinear 模型配置
# ============================================================

# ---------------------- 模型结构 ----------------------

# 模型名称
model: dlinear

# 输入序列长度
seq_len: 96

# 预测序列长度
pred_len: 16

# 输入特征维度（变量数）
enc_in: 17

# 是否每个变量使用独立线性层
# true: 每个变量独立，官方 Weather 基准配置
# false: 所有变量共享（参数更少但表达力弱）
individual: true

# 移动平均窗口大小（序列分解用）
# 值越大 → 趋势越平滑，季节性分量越多
# 25 步 ≈ 6 小时（15min 间隔）
kernel_size: 25

# ---------------------- 训练参数 ----------------------

seed: 42
device: cuda
lr: 0.001
batch_size: 32
epochs: 100
patience: 10
optimizer: adamw
scheduler: cosine
grad_clip: 1.0

# ---------------------- 数据路径 ----------------------

data_dir: data/wind_power/processed
target_col: actual_power
